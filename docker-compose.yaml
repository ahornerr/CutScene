services:
  cutscene:
    image: ghcr.io/ahornerr/cutscene:main
    ports:
      - 8080:8080
    volumes:
      - ./config.yaml:/config.yaml:ro
      # Durable application data: clip metadata, MP4s, the token-encryption
      # key, and the session database (sessions.sqlite3, under storage.root).
      # Transient render jobs intentionally remain under the container's /tmp.
      - cutscene-data:/data

volumes:
  cutscene-data:
