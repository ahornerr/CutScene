# AMD ROCm embedding overlay. Use with docker-compose.yaml and
# docker-compose.semantic-search.yaml, and do not combine with the NVIDIA
# overlay.
services:
  cutscene:
    depends_on:
      embeddings:
        condition: service_healthy

  embeddings:
    image: vllm/vllm-openai-rocm:latest
    command:
      - BAAI/bge-base-en-v1.5
      - --runner
      - pooling
      - --pooler-config.task
      - embed
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    ipc: host
    security_opt:
      - seccomp=unconfined
    environment:
      VLLM_TARGET_DEVICE: rocm
      HIP_VISIBLE_DEVICES: "0"
      # Set HSA_OVERRIDE_GFX_VERSION when required by the host GPU. The value
      # is architecture-specific; see the ROCm documentation before setting it.
      HF_HOME: /data/huggingface
    volumes:
      - semantic-search-huggingface-cache:/data/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  semantic-search-huggingface-cache:
