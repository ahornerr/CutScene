plex:
  host: https://my.plex.server
  token: replace-with-a-plex-server-token
api:
  listen_addr: ":8080"
  # Browser-reachable URL used as the Plex OAuth/PIN authentication forward URL.
  domain: http://localhost:8080
ffmpeg:
  # Maximum concurrent FFmpeg processes, shared by previews and render jobs.
  # Defaults to 2 when omitted, zero, or negative.
  concurrency: 2
  # libx264 is software encoding. h264_vaapi requires Linux VAAPI and /dev/dri.
  # h264_nvenc requires Nvidia drivers, Docker GPU access, and the Nvidia
  # Container Toolkit. See README.md for the Docker GPU setup.
  codec: libx264
storage:
  # Durable clips, clips.sqlite3, and clip-token.key live below this root.
  # In the supplied Compose setup this is the mounted cutscene-data volume.
  # If omitted, the backend defaults to ./data relative to its working directory.
  root: /data
  # Relative paths are resolved below storage.root. Omit to use clips.sqlite3.
  # Absolute paths and paths escaping root are rejected.
  database: clips.sqlite3
semantic_search:
  # NVIDIA: use docker-compose.yaml + docker-compose.semantic-search.yaml +
  # docker-compose.semantic-search.nvidia.yaml.
  enabled: true
  postgres_dsn: postgresql://cutscene:cutscene-poc@postgres:5432/cutscene?sslmode=disable
  embeddings_provider: tei
  embeddings_url: http://tei:80
  # AMD alternative: use the AMD overlay instead, then change the two lines
  # above to:
  # embeddings_provider: openai
  # embeddings_url: http://embeddings:8000
